<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カレンダーアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calendar-container">
        <!-- ヘッダー（年月と切り替えボタン） -->
        <header class="calendar-header">
            <button id="prev-btn">&lt; 前月</button>
            <h2 id="month-year-display">2026年 11月</h2>
            <button id="next-btn">次月 &gt;</button>
        </header>

        <!-- 曜日ヘッダー -->
        <div class="weekdays">
            <div class="sun">日</div>
            <div>月</div>
            <div>火</div>
            <div>水</div>
            <div>木</div>
            <div>金</div>
            <div class="sat">土</div>
        </div>

        <!-- カレンダーの日付グリッド（JSで動的に生成） -->
        <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- 予定追加・詳細用の簡易モーダル（必要に応じて拡張） -->
    <div id="event-modal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modal-date-title">予定の追加</h3>
            <form id="event-form">
                <input type="hidden" id="event-date">
                <div class="form-group">
                    <label>タイトル:</label>
                    <input type="text" id="event-title" required>
                </div>
                <div class="form-group">
                    <label>カテゴリ:</label>
                    <input type="text" id="event-category" placeholder="例: 勉強、プライベート">
                </div>
                <div class="form-actions">
                    <button type="submit">保存</button>
                    <button type="button" id="close-modal-btn">キャンセル</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
